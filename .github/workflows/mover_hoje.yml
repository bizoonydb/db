name: Mover PDFs enviados nas últimas 10h

on:
  workflow_dispatch:

jobs:
  mover-pdfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar pasta HJ se não existir
        run: mkdir -p db/pda/HJ

      - name: Listar PDFs commitados nas últimas 10h
        id: listar
        run: |
          arquivos=$(git log --since="10 hours ago" --name-only --pretty=format: | grep '^db/pda/.*\.pdf$' | sort | uniq || true)
          echo "Arquivos detectados:"
          echo "$arquivos"
          echo "arquivos<<EOF" >> $GITHUB_OUTPUT
          echo "$arquivos" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Mover arquivos detectados
        run: |
          if [ -n "${{ steps.listar.outputs.arquivos }}" ]; then
            echo "${{ steps.listar.outputs.arquivos }}" | while read -r arq; do
              [ -f "$arq" ] && mv "$arq" db/pda/HJ/ && echo "📦 Movido: $arq"
            done
          else
            echo "⚠️ Nenhum PDF foi commitado nas últimas 10h."
          fi

      - name: Commit e push das mudanças
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Mover PDFs das últimas 10h para HJ [automático]" || echo "Sem alterações"
          git pull --rebase origin main || true
          git push origin main || true
