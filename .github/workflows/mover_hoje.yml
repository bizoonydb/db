name: Mover últimos 96 PDFs

on:
  workflow_dispatch:  # executa manualmente pelo botão “Run workflow”

jobs:
  mover-ultimos-96:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar pasta HJ se não existir
        run: mkdir -p db/pda/HJ

      - name: Mover os 96 PDFs mais recentes (por data real de modificação)
        run: |
          echo "🔍 Buscando os 96 PDFs mais recentes na pasta db/pda..."

          # Lista os 96 PDFs mais recentes por data real
          ultimos=$(find db/pda -maxdepth 1 -type f -name "*.pdf" -printf "%T@ %p\n" | sort -n | tail -n 96 | awk '{print $2}')

          echo "Arquivos detectados:"
          echo "$ultimos"

          if [ -z "$ultimos" ]; then
            echo "⚠️ Nenhum PDF encontrado."
            exit 0
          fi

          for arq in $ultimos; do
            if [ -f "$arq" ]; then
              echo "➡️ Movendo $arq para db/pda/HJ/"
              mv "$arq" db/pda/HJ/
            fi
          done

      - name: Commit e push das mudanças
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Mover últimos 96 PDFs para HJ [automático]" || echo "Sem alterações"
          git pull --rebase origin main || true
          git push origin main || true
