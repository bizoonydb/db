name: Mover arquivos de hoje

on:
  workflow_dispatch:  # 👈 só executa quando você clicar em “Run workflow”

jobs:
  mover-hoje:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar pasta HJ se não existir
        run: mkdir -p db/pda/HJ

      - name: Mover arquivos modificados hoje
        run: |
          find db/pda -maxdepth 1 -type f -daystart -mtime 0 -exec mv {} db/pda/HJ/ \;

      - name: Commit e push das mudanças
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Mover arquivos de hoje para HJ [automático]" || echo "Sem alterações"
          git pull --rebase origin main || true
          git push origin main || true
