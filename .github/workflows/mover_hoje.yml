name: Mover arquivos de hoje

on:
  workflow_dispatch: # executa manualmente no painel Actions

jobs:
  mover-hoje:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Criar pasta HJ se não existir
        run: mkdir -p db/pda/HJ

      - name: Mover arquivos modificados hoje
        run: |
          echo "Verificando arquivos modificados hoje..."
          arquivos=$(find db/pda -maxdepth 1 -type f -mtime -1 -name "*.pdf")
          if [ -z "$arquivos" ]; then
            echo "Nenhum arquivo novo hoje."
            exit 0
          fi
          echo "Movendo arquivos para db/pda/HJ/"
          mv $arquivos db/pda/HJ/

      - name: Commit e push das mudanças
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Mover arquivos de hoje para HJ [automático]" || echo "Sem alterações para commitar"
          git push
