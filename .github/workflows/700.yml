name: Process PDFs in Batches

on:
  workflow_dispatch:  # Permite disparar manualmente

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v3

      - name: Count PDFs and create matrix
        id: set-matrix
        run: |
          # Conta todos os PDFs na pasta ./pda
          total=$(ls ./pda/*.pdf | wc -l)
          batch_size=300
          
          # Calcula número de batches
          num_batches=$(( (total + batch_size - 1) / batch_size ))

          # Cria JSON para matriz
          matrix_json="{\"batch\":["
          for ((i=1;i<=num_batches;i++)); do
            matrix_json+="$i"
            if [ $i -lt $num_batches ]; then
              matrix_json+=","
            fi
          done
          matrix_json+="]}"
          echo "matrix=$matrix_json" >> $GITHUB_OUTPUT

  process-batch:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.prepare-matrix.outputs.matrix)}}
    steps:
      - uses: actions/checkout@v3

      - name: Process PDFs in batch
        run: |
          files=($(ls ./pda/*.pdf))
          batch_size=300
          start=$(( (matrix.batch - 1) * batch_size ))
          batch_files=("${files[@]:$start:$batch_size}")

          echo "Processing batch #${matrix.batch} with ${#batch_files[@]} PDFs"

          mkdir -p ./processed_batch_${matrix.batch}

          for pdf in "${batch_files[@]}"; do
            echo " -> $pdf"
            # Aqui você chama seu script de build, ex:
            # node build.js "$pdf"
            # ou qualquer processamento que você faça
            cp "$pdf" "./processed_batch_${matrix.batch}/"  # Exemplo de "processamento"
          done

      - name: Upload processed batch as artifact
        uses: actions/upload-artifact@v3
        with:
          name: processed-batch-${{ matrix.batch }}
          path: ./processed_batch_${{ matrix.batch }}
