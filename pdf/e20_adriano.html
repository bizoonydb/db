<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Board</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: #333;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            z-index: 9999;
        }
        iframe {
            position: fixed;
            top: 80px;
            left: 0;
            width: 100%;
            height: calc(100% - 80px);
            border: none;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        DIGITAL BOARD _ CLIENTE ADRIANO-1 _ MOTO E20
    </div>

    <iframe id="myIframe"></iframe>

    <script>
        // Defina aqui a URL que deseja carregar no iframe
        const url = "https://bizoonydb.github.io/PDFJS/HANDSVIEW/index.html?fileLink=https://bizoonydb.github.io/PDFJS/build/MT/Moto%20E20.bvr&script=A";
        document.getElementById("myIframe").src = url;
    </script>

</body>
</html>
